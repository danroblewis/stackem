[project]
name = "stackem"
version = "1.0.0"
description = "Keep a chain of stacked git branches and their pull requests in sync."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Lewis" }]
keywords = ["git", "stacked", "pull-request", "rebase", "github"]

# Standard library only.  SPEC.md sec 11: `uvx stackem` must work with no install
# step, which means no wheels to resolve and no post-install hooks.
dependencies = []

[project.scripts]
stackem = "stackem.cli:main"

[project.urls]
Homepage = "https://github.com/danroblewis/stackem"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackem"]

# PEP 735 group, installed by `uv run` / `uv sync` by default.
[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "acceptance: opt-in suite against the real GitHub repo (SPEC.md sec 10); deselected by default",
]
